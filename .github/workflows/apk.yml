name: 编译本地LuCI插件(APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签出本仓库源码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          # 安装 zstd 用于解压新版 SDK 的 tar.zst 格式
          sudo apt-get install -y zstd curl

      - name: 下载并配置工具链
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          
          # 创建 SDK 目录并进入
          mkdir sdk && cd sdk
          
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/"
          
          # 使用 curl -sL 跟随重定向，并解析 sha256sums 纯文本文件获取最新 SDK 名称
          SDK_FILE=$(curl -sL "${BASE_URL}sha256sums" | grep -oE 'openwrt-sdk-rockchip-armv8[a-zA-Z0-9_\.-]+\.tar\.(zst|xz)' | head -n 1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 未能抓取到 SDK 文件名，请检查 OpenWrt 官网状态。"
            exit 1
          fi
          
          echo "成功获取 SDK 文件名: $SDK_FILE"
          echo "正在下载最新 SDK: ${BASE_URL}${SDK_FILE}"
          
          # 统一将下载的文件命名为 sdk_archive
          wget -qO sdk_archive "${BASE_URL}${SDK_FILE}"
          
          # 自动判断后缀名并使用正确的解压方式
