name: 编译本地LuCI插件(APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签出本仓库源码
        uses: actions/checkout@v4

      # 新版 SDK 使用了 zstd 压缩，确保系统安装了对应工具
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

- name: 下载并配置工具链
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          
          # 创建 SDK 目录并进入
          mkdir sdk && cd sdk
          
          # 动态获取最新的 Snapshot SDK 文件名，避免文件更新导致 404 报错
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/"
          SDK_FILE=$(curl -s "$BASE_URL" | grep -oE 'openwrt-sdk-rockchip-armv8[^"]+\.tar\.zst' | head -n 1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "错误: 未能抓取到 SDK 文件名，请检查 OpenWrt 官网状态。"
            exit 1
          fi
          
          echo "正在下载最新 SDK: ${BASE_URL}${SDK_FILE}"
          wget -qO sdk.tar.zst "${BASE_URL}${SDK_FILE}"
          
          # 解压 zst 格式的 SDK
          tar -xf sdk.tar.zst --strip-components=1
          rm -f sdk.tar.zst
          
          # 1. 创建插件的目标目录
          mkdir -p package/luci-app-generic-runner/root
          
          # 2. 复制根目录下的 Makefile 到插件目录
          cp ../Makefile package/luci-app-generic-runner/
          
          # 3. 把根目录下的 etc 和 usr 目录，复制到插件的 root 文件夹下 👇
          [ -d "../etc" ] && cp -R ../etc package/luci-app-generic-runner/root/
          [ -d "../usr" ] && cp -R ../usr package/luci-app-generic-runner/root/
          
          # 更新 feeds 并生成默认配置
          ./scripts/feeds update -a
          make defconfig

      - name: 开始编译
        run: |
          cd sdk
          # V=s 用于输出详细日志，-j 用于多线程加速
          make package/luci-app-generic-runner/compile V=s -j$(nproc)

      - name: 上传编译附件
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-generic-runner-apk
          # 将后缀改为 .apk。为了防止分类不在 base 目录下，中间的目录也用通配符 * 替代
          path: sdk/bin/packages/aarch64_generic/*/*.apk
