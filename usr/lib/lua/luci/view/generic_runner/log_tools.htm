<fieldset class="cbi-section">
    <legend><%:状态与配置管理%></legend>
    <div class="cbi-section-descr" style="margin-bottom: 15px;">
        <span style="display:inline-block; margin-right:15px;">
            <!-- 这里修改了 accept 属性，允许选择 .config 文件 -->
            <input type="file" id="config_upload" class="cbi-input-file" accept=".config, *" style="margin-right:5px;" />
            <input type="button" class="cbi-button cbi-button-apply" value="<%:导入配置%>" onclick="import_config()" />
        </span>
        <span style="display:inline-block;">
            <input type="button" class="cbi-button cbi-button-download" value="<%:导出配置%>" onclick="export_config()" />
        </span>
        <button type="button" class="cbi-button cbi-button-reset" style="margin-left:15px;" onclick="refresh_log()"><%:刷新日志%></button>
    </div>
    
    <div>
        <textarea id="generic_runner_log" class="cbi-input-textarea" style="width: 100%; height: 250px; resize: vertical; background-color:#1e1e1e; color:#00ff00; font-family: monospace;" readonly="readonly">日志加载中...</textarea>
    </div>
</fieldset>

<script type="text/javascript">
    function export_config() {
        window.location.href = "<%=luci.dispatcher.build_url('admin', 'services', 'generic_runner', 'export')%>";
    }

    function import_config() {
        var fileInput = document.getElementById('config_upload');
        if (!fileInput.files.length) {
            alert("请先选择要导入的配置文件！");
            return;
        }
        
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = "<%=luci.dispatcher.build_url('admin', 'services', 'generic_runner', 'import')%>";
        form.enctype = 'multipart/form-data';
        form.style.display = 'none';

        var newFileInput = fileInput.cloneNode(true);
        fileInput.parentNode.replaceChild(newFileInput, fileInput);
        form.appendChild(fileInput);

        document.body.appendChild(form);
        form.submit();
    }

    function refresh_log() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "<%=luci.dispatcher.build_url('admin', 'services', 'generic_runner', 'get_log')%>" + "?t=" + Math.random(), true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var log_box = document.getElementById("generic_runner_log");
                var isScrolledToBottom = log_box.scrollHeight - log_box.clientHeight <= log_box.scrollTop + 10;
                log_box.value = xhr.responseText;
                if (isScrolledToBottom) {
                    log_box.scrollTop = log_box.scrollHeight; 
                }
            }
        };
        xhr.send();
    }
    document.addEventListener("DOMContentLoaded", function() {
        refresh_log();
        setInterval(refresh_log, 3000); 
    });
</script>
